# /etc/nginx/conf.d/vts.conf - Hardened High-Concurrency NGINX Reverse Proxy for OpenText VTS

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen       443 ssl http2 backlog=16384;
    server_name  vts-server.local vts-server 192.168.122.245;

    # SSL Certificate & Key
    ssl_certificate      /etc/pki/tls/certs/vts.crt;
    ssl_certificate_key  /etc/pki/tls/private/vts.key;

    # TLS 1.2 & TLS 1.3 + Session Caching for High-VUser Throughput
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache    shared:SSL:50m;
    ssl_session_timeout  1d;
    ssl_session_tickets  off;

    # Common Reverse Proxy Headers & Keep-Alive Settings (Inherited by all blocks)
    proxy_http_version   1.1;
    proxy_set_header     Upgrade $http_upgrade;
    proxy_set_header     Connection $connection_upgrade;
    proxy_set_header     Host $host;
    proxy_set_header     X-Real-IP $remote_addr;
    proxy_set_header     X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header     X-Forwarded-Proto https;

    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Allow large CSV test-data uploads via Web UI / REST API
    client_max_body_size 100m;

    # OpenText Query-String Port Forwarding + Web UI Proxy
    location / {
        # Whitelist ONLY valid VTS Admin/API ports (4000, 2000-2050, 8888-8908)
        # Prevents SSRF access to internal Valkey ports (6000-7000) or OS ports (22)
        if ($query_string ~* "^portnumber=(4000|888[89]|889[0-9]|890[0-8]|20[0-4][0-9]|2050)(.*)$") {
            set $port $1;
            set $para $2;
            proxy_pass http://127.0.0.1:$port$para;
            break;
        }

        # Block any disallowed portnumber= parameter
        if ($query_string ~* "portnumber=") {
            return 403;
        }

        # Default forward to VTS Web Admin UI (Port 4000)
        proxy_pass http://127.0.0.1:4000;
    }
}

# Redirect HTTP (Port 80) to HTTPS (Port 443)
server {
    listen       80;
    server_name  vts-server.local vts-server 192.168.122.245;
    return 301 https://$host$request_uri;
}
