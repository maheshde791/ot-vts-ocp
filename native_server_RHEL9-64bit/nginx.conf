# /etc/nginx/nginx.conf - Global NGINX Configuration for High-Concurrency OpenText VTS (RHEL 9)
# Included site configs live in /etc/nginx/conf.d/*.conf (e.g., /etc/nginx/conf.d/vts.conf).

user nginx;

# Set to 'auto' on 8-vCPU servers, or '16' on 24-vCPU production servers
# (reserves 8 vCPUs for VTS apiserver, 20 Valkey engines, and OS networking).
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 8192;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # Loads /etc/nginx/conf.d/vts.conf (HTTPS TLS termination + ?portnumber= proxy)
    include /etc/nginx/conf.d/*.conf;
}
