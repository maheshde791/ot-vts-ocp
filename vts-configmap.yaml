apiVersion: v1
kind: ConfigMap
metadata:
  name: vts-config
  namespace: lre-vts
data:
  configure.json: |
    {  
      "dbPath": "/var/lib/OT/OT_VTS/db/data",  
      "defaultDbName" : "Default",
      "adminPort": 4000,
      "defaultApiPort": 8888,
      "defaultStart": true,
      "enableDiag": false,
      "autoRefreshGrid": true,
      "maxInstancesAllowed": 50,
      "autoCreateIndexedColumn": true,
      "normalizeCSV": false,
      "admin": {
        "authentication": "Basic",
        "users": [
          {
            "user": "vtsadmin",
            "password": "<Set your password here>",
            "display": "VTS Administrator"
          }
        ],
        "role": {
          "administrator": [
            "vtsadmin"
          ],
          "user": []
        },
        "requireBasicAuthForAPI": false,
        "domain": "",
        "domaincontroller": "",
        "ldapsCert": "",
        "ldapsCA": "",
        "useSSL": false,
        "certificate": "vts.crt",
        "privateKey": "vts.key",
        "passphrase": "",
        "ca": "vts.crt",
        "minVersion": "TLSv1.2",
        "maxVersion": "TLSv1.3",
        "ciphers": "ETCD_CIPHER_SUITES=TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384",
        "requestClientCert": false
      },
      "languages": [
        { "en": "en-us" },
        { "zh-cn": ["zh", "zh-sg"] },
        { "ja": "ja" },
        { "ko": ["zh", "zh-sg"] },
        { "it": "zh-hk"},
        { "es": "zh-hk"},
        { "fr": "fr-fr"},
        { "ru": "ru"},
        "de"
      ],
      "defaultLanguage": "en",
      "dbInfo": {
        "connPool": {
          "maxIdle": 3500,
          "maxActive": 3500
        },
        "dbServerPort": { 
          "start": 6000,
          "end": 7000
        },
        "dbCheck": {
          "waitingTime": 1,
          "retryTimes": 3600
        }
      },
      "logger": {
        "level": "error", 
        "transports": {
          "file": {
            "type": "File",
            "path": "/tmp/VTS"
          },
          "console": {
            "type": "Console"
          }
        }
      }
    }
