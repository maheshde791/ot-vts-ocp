apiVersion: v1
kind: ConfigMap
metadata:
  name: vts-app1-config
  namespace: lre-vts
  labels:
    app: vts-app1-team
data:
  # 1. OpenText VTS 26.1 Configuration Template (App1 Team)
  # Passwords are NOT stored here: __VTS_ADMIN_PASSWORD__ is injected at container startup
  # from Kubernetes Secret 'vts-app1-credentials' (VTS_ADMIN_PASSWORD env var).
  configure.json: |
    {
      "dbPath": "/var/lib/OT/OT_VTS/db/data",
      "defaultDbName": "Default",
      "adminPort": 4000,
      "defaultApiPort": 8888,
      "defaultStart": true,
      "enableDiag": false,
      "autoRefreshGrid": false,
      "maxInstancesAllowed": 50,
      "autoCreateIndexedColumn": true,
      "normalizeCSV": false,
      "admin": {
        "authentication": "Basic",
        "users": [
          {
            "user": "vtsadmin",
            "password": "__VTS_ADMIN_PASSWORD__",
            "display": "VTS Administrator"
          },
          {
            "user": "tester",
            "password": "__VTS_READONLY_PASSWORD__",
            "display": "Test Operator (Read-Only)"
          }
        ],
        "role": {
          "administrator": [
            "vtsadmin"
          ],
          "user": [
            "tester"
          ]
        },
        "requireBasicAuthForAPI": true,
        "useSSL": false
      },
      "defaultLanguage": "en",
      "dbInfo": {
        "connPool": {
          "maxIdle": 5000,
          "maxActive": 5000
        },
        "dbServerPort": {
          "start": 10000,
          "end": 30000
        },
        "dbCheck": {
          "waitingTime": 10,
          "retryTimes": 3600
        }
      },
      "logger": {
        "level": "error",
        "transports": {
          "console": {
            "type": "Console"
          }
        }
      }
    }

  # 2. In-Container NGINX Reverse Proxy (Non-Root Port 8443)
  vts-nginx.conf: |
    worker_processes auto;
    error_log /tmp/nginx_error.log warn;
    pid /tmp/nginx.pid;

    events {
        worker_connections 8000;
    }

    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;
        sendfile      on;
        keepalive_timeout 65;

        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      '';
        }

        server {
            # HTTP/2 explicitly disabled to remediate CVE-2026-123007 and CVE-2026-123633.
            listen 8443 ssl;
            server_name _;

            # Enterprise PKI / CA-signed TLS Certificate (replaces sandbox self-signed cert).
            # Mounted read-only from Kubernetes TLS Secret (vts-app1-tls-cert) via Key Vault / cert-manager.
            # Enforces TLS 1.2/1.3 with AES-256-GCM & AES-128-GCM encryption (X.509 PEM: RSA-2048/4096 or ECDSA P-256).
            ssl_certificate      /opt/OT/OT_VTS/web/certs/tls.crt;
            ssl_certificate_key  /opt/OT/OT_VTS/web/certs/tls.key;
            ssl_protocols        TLSv1.2 TLSv1.3;
            ssl_ciphers          ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
            ssl_session_cache    shared:SSL:50m;
            ssl_session_timeout  1d;

            proxy_http_version   1.1;
            proxy_set_header     Upgrade $http_upgrade;
            proxy_set_header     Connection $connection_upgrade;
            proxy_set_header     Host $host;
            proxy_set_header     X-Real-IP $remote_addr;
            proxy_set_header     X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header     X-Forwarded-Proto https;

            client_max_body_size 100m;
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            location ~* /favicon\.ico$ {
                return 204;
                access_log off;
                log_not_found off;
            }

            location / {
                # 1. Multi-Instance Query-String routing (ports 4000, 8888, 2000-2050)
                if ($query_string ~* "^portnumber=(4000|888[89]|889[0-9]|890[0-8]|20[0-4][0-9]|2050)(.*)$") {
                    set $inst_port $1;
                    set $inst_param $2;
                    proxy_pass http://127.0.0.1:$inst_port$inst_param;
                    break;
                }

                # 2. Block SSRF attempts targeting internal Valkey engines (10000-30000)
                if ($query_string ~* "portnumber=") {
                    return 403;
                }

                # 3. Direct proxy to native VTS server (Admin UI & WebSockets)
                proxy_pass http://127.0.0.1:4000;
            }
        }
    }
