apiVersion: apps/v1
kind: Deployment
metadata:
  name: vts-app1-team
  namespace: lre-vts
  labels:
    app: vts-app1-team
spec:
  replicas: 1
  strategy:
    type: Recreate # Ensures RWO persistent volume cleanly unmounts before reattachment
  selector:
    matchLabels:
      app: vts-app1-team
  template:
    metadata:
      labels:
        app: vts-app1-team
    spec:
      # Pod-level security context (Complies with Azure Policy Restricted Profile)
      securityContext:
        runAsNonRoot: true
        runAsUser: 54345
        runAsGroup: 54345
        fsGroup: 54345
        seccompProfile:
          type: RuntimeDefault

      containers:
      - name: vts-server
        # Fully qualified enterprise registry path with immutable sha256 digest
        image: artifactory.internal.cloud.corp/enterprise-docker-release-local/vts/opentext_vts_linux_ubuntu@sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
        imagePullPolicy: IfNotPresent
        workingDir: /opt/OT/OT_VTS/web
        
        # Container-level security context (Passes Gatekeeper / CIS Kubernetes checks)
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 54345
          runAsGroup: 54345
          capabilities:
            drop:
            - ALL

        env:
        - name: GIN_MODE
          value: "release"
        - name: VTS_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: vts-app1-credentials
              key: admin_password

        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"

        command: ["/bin/bash", "-c"]
        args:
        - |
          export GIN_MODE=release

          # 1. Non-destructive repair, validation, and persistence of instances.json
          DATA_FILE="/var/lib/OT/OT_VTS/db/data/instances.json"
          BAK_FILE="/var/lib/OT/OT_VTS/db/data/instances.json.bak"
          DATA_DIR="/var/lib/OT/OT_VTS/db/data"

          mkdir -p "$DATA_DIR"
          /opt/OT/OT_VTS/web/node -e '
          const fs = require("fs");
          const [dataFile, bakFile, dbDir] = process.argv.slice(1);

          let instances = null;
          if (fs.existsSync(dataFile)) {
            try {
              let raw = fs.readFileSync(dataFile, "utf8").replace(/\0/g, "").trim();
              if (raw.length > 0) {
                let parsed = JSON.parse(raw);
                if (Array.isArray(parsed)) instances = parsed;
              }
            } catch (e) {}
          }
          if (!instances && fs.existsSync(bakFile)) {
            try {
              let rawBak = fs.readFileSync(bakFile, "utf8").replace(/\0/g, "").trim();
              if (rawBak.length > 0) {
                let parsedBak = JSON.parse(rawBak);
                if (Array.isArray(parsedBak)) instances = parsedBak;
              }
            } catch (e) {}
          }
          if (!instances && fs.existsSync(dbDir)) {
            try {
              const files = fs.readdirSync(dbDir);
              const vtsFiles = files.filter(f => f.endsWith(".vts") && f.toLowerCase() !== "default.vts");
              if (vtsFiles.length > 0) {
                let port = 2000;
                instances = vtsFiles.sort().map(f => ({ name: f.replace(/\.vts$/, ""), port: port++, serviceStatus: true }));
              }
            } catch (e) {}
          }
          if (!instances) instances = [];
          fs.writeFileSync(dataFile, JSON.stringify(instances, null, 2) + "\n", { encoding: "utf8", mode: 0o664 });
          fs.writeFileSync(bakFile, JSON.stringify(instances, null, 2) + "\n", { encoding: "utf8", mode: 0o664 });
          ' "$DATA_FILE" "$BAK_FILE" "$DATA_DIR" 2>/dev/null || true

          # Symlink instances.json so apiserver reads and writes directly to PVC
          ln -sf "$DATA_FILE" /opt/OT/OT_VTS/web/instances.json

          # 2. Configure automatic RDB snapshots every 60s
          sed -i '/^save /d' /opt/OT/OT_VTS/web/redis.conf 2>/dev/null || true
          echo "save 60 1" >> /opt/OT/OT_VTS/web/redis.conf 2>/dev/null || true

          # 3. Start in-container NGINX reverse proxy on port 8443
          nginx

          # 4. Start supervisor daemon in background
          ./api_daemon </dev/null &

          # 5. Keep container alive and track processes
          wait -n
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/bash
              - -c
              - |
                if [ -s /var/lib/OT/OT_VTS/db/data/instances.json ]; then
                  cp -f /var/lib/OT/OT_VTS/db/data/instances.json /var/lib/OT/OT_VTS/db/data/instances.json.bak
                fi
                for pid in $(pgrep valkey-server 2>/dev/null); do
                  PORT=$(cat /proc/$pid/cmdline 2>/dev/null | tr '\0' ' ' | grep -oP '127\.0\.0\.1:\K\d+')
                  if [ -n "$PORT" ]; then
                    /opt/OT/OT_VTS/web/valkey-cli -p "$PORT" save 2>/dev/null || true
                  fi
                done
                sync
        ports:
        - name: https-web
          containerPort: 8443
        # Health probes: Use tcpSocket on port 8443 because VTS Basic Auth returns
        # HTTP 401 on /, which causes Kubernetes httpGet probes to fail.
        startupProbe:
          tcpSocket:
            port: 8443
          periodSeconds: 5
          failureThreshold: 24 # Allows up to 120s for Valkey DB load on startup
        readinessProbe:
          tcpSocket:
            port: 8443
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: 8443
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: config-mount
          mountPath: /opt/OT/OT_VTS/web/configure.json
          subPath: configure.json
        - name: nginx-mount
          mountPath: /etc/nginx/nginx.conf
          subPath: vts-nginx.conf
        - name: vts-db-storage
          mountPath: /var/lib/OT/OT_VTS/db/data
        - name: enterprise-tls
          mountPath: /opt/OT/OT_VTS/web/certs
          readOnly: true
      volumes:
      - name: config-mount
        configMap:
          name: vts-app1-config
          items:
          - key: configure.json
            path: configure.json
      - name: nginx-mount
        configMap:
          name: vts-app1-config
          items:
          - key: vts-nginx.conf
            path: vts-nginx.conf
      - name: vts-db-storage
        persistentVolumeClaim:
          claimName: vts-app1-data-pvc
      - name: enterprise-tls
        secret:
          secretName: vts-app1-tls-cert
