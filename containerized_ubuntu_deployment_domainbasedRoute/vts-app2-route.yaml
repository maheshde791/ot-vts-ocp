apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: vts-app2-team-route
  namespace: lre-vts
  labels:
    app: vts-app2-team
spec:
  host: vts-app2.apps-crc.testing
  to:
    kind: Service
    name: vts-app2-team-service
  port:
    targetPort: https-web
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
