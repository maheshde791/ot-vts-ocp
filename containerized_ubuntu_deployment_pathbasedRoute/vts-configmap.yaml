apiVersion: v1
kind: ConfigMap
metadata:
  name: vts-app1-config
  namespace: lre-vts
  labels:
    app: vts-app1-team
data:
  # 1. OpenText VTS 26.1 Tuned Configuration with RBAC & Wide Valkey Port Pool
  configure.json: |
    {  
      "dbPath": "/var/lib/OT/OT_VTS/db/data",  
      "defaultDbName": "Default",
      "adminPort": 4000,
      "defaultApiPort": 8888,
      "defaultStart": true,
      "enableDiag": false,
      "autoRefreshGrid": false,
      "maxInstancesAllowed": 50,
      "autoCreateIndexedColumn": true,
      "normalizeCSV": false,
      "admin": {
        "authentication": "Basic",
        "users": [
          {
            "user": "vtsadmin",
            "password": "*****",
            "display": "VTS Administrator"
          },
          {
            "user": "tester",
            "password": "*****",
            "display": "Test Operator"
          }
        ],
        "role": {
          "administrator": [
            "vtsadmin"
          ],
          "user": [
            "tester"
          ]
        },
        "requireBasicAuthForAPI": true,
        "domain": "",
        "domaincontroller": "",
        "ldapsCert": "",
        "ldapsCA": "",
        "useSSL": false,
        "certificate": "vts.crt",
        "privateKey": "vts.key",
        "passphrase": "",
        "ca": "vts.crt",
        "minVersion": "TLSv1.2",
        "maxVersion": "TLSv1.3",
        "ciphers": "ETCD_CIPHER_SUITES=TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384",
        "requestClientCert": false
      },
      "languages": [
        { "en": "en-us" },
        { "zh-cn": ["zh", "zh-sg"] },
        { "ja": "ja" },
        { "ko": ["zh", "zh-sg"] },
        { "it": "zh-hk" },
        { "es": "zh-hk" },
        { "fr": "fr-fr" },
        { "ru": "ru" },
        "de"
      ],
      "defaultLanguage": "en",
      "dbInfo": {
        "connPool": {
          "maxIdle": 5000,
          "maxActive": 5000
        },
        "dbServerPort": { 
          "start": 10000,
          "end": 30000
        },
        "dbCheck": {
          "waitingTime": 10,
          "retryTimes": 3600
        }
      },
      "logger": {
        "level": "error", 
        "transports": {
          "file": {
            "type": "File",
            "path": "/var/log/vts.log"
          },
          "console": {
            "type": "Console"
          }
        }
      }
    }

  # 2. In-Container NGINX Reverse Proxy (HTTPS 8443, Path-Strip & Multi-Instance Routing)
  # ======================================================================================
  # ARCHITECTURAL NOTE ON GATEWAY PATH-BASED ROUTING:
  # --------------------------------------------------------------------------------------
  # In enterprise cloud landing zones, the Application Gateway / Ingress Router routes
  # external traffic based on URL path prefixes (e.g. /app1-team, /app2-team) to achieve
  # a single unified DNS name across multiple tenant workloads.
  #
  # WHY PATH STRIPPING IS MANDATORY IN NGINX:
  # OpenText VTS internal Go routing (apiserver) expects native paths:
  #   - "/" for Web Admin Console
  #   - "/instances" for Instance Manager
  #   - "/client_api/*" for Data Queries and Updates
  # Because Cloud Ingress Gateways and OpenShift Routes forward incoming request URIs as-is
  # without stripping prefixes, NGINX must intercept the team prefix, strip it, and proxy
  # the clean native URI to VTS on 127.0.0.1 to prevent HTTP 404 Not Found errors.
  #
  # PATH PATTERN CONFIGURATION GUIDE:
  # - Pattern A (Standard Single-Level Prefix): e.g. /app1-team/*, /app2-team/*
  #     Regex: ^/[^/]+(?<req_path>/.*)?$
  # - Pattern B (Multi-Level / Nested Enterprise Prefix): e.g. /vts/app1-team/*, /apps/app1-team/*
  #     Regex: ^/(?:vts|apps)/[^/]+(?<req_path>/.*)?$
  # Adjust the location regex below if Enterprise Cloud Gateway routing standards change.
  # ======================================================================================
  vts-nginx.conf: |
    worker_processes auto;
    error_log /tmp/nginx_error.log;
    pid /tmp/nginx.pid;

    events {
        worker_connections 8000;
    }

    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;
        sendfile      on;
        keepalive_timeout 65;

        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      '';
        }

        server {
            listen 8443 ssl http2;
            server_name _;

            ssl_certificate      /opt/OT/OT_VTS/web/vts.crt;
            ssl_certificate_key  /opt/OT/OT_VTS/web/vts.key;
            ssl_protocols        TLSv1.2 TLSv1.3;
            ssl_ciphers          HIGH:!aNULL:!MD5;
            ssl_session_cache    shared:SSL:50m;
            ssl_session_timeout  1d;

            proxy_http_version   1.1;
            proxy_set_header     Upgrade $http_upgrade;
            proxy_set_header     Connection $connection_upgrade;
            proxy_set_header     Host $host;
            proxy_set_header     X-Real-IP $remote_addr;
            proxy_set_header     X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header     X-Forwarded-Proto https;

            client_max_body_size 100m;
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            location ~* /favicon\.ico$ {
                return 204;
                access_log off;
                log_not_found off;
            }

            # ----------------------------------------------------------------------------------
            # Primary Gateway Ingress Path Handler (Matches: /app1-team, /app1-team/, /app2-team, etc.)
            # ----------------------------------------------------------------------------------
            location ~ ^/(?<team_prefix>app[0-9]+-team)(?<req_path>/.*)?$ {
                # 1. Multi-Instance Query-String routing (ports 4000, 8888, 2000-2050)
                # Example: https://<domain>/app1-team/?portnumber=2000/client_api/get
                if ($query_string ~* "^portnumber=(4000|888[89]|889[0-9]|890[0-8]|20[0-4][0-9]|2050)(.*)$") {
                    set $inst_port $1;
                    set $inst_param $2;
                    proxy_pass http://127.0.0.1:$inst_port$inst_param;
                    break;
                }

                # 2. Block SSRF attempts targeting internal Valkey database engines (10000-30000)
                if ($query_string ~* "portnumber=") {
                    return 403;
                }

                # 3. Trailing slash redirect for base path
                if ($req_path = "") {
                    return 301 https://$host/$team_prefix/;
                }

                # 4. Strip team prefix and proxy to VTS native server
                rewrite ^/[^/]+(/.*)?$ $1 break;
                proxy_pass http://127.0.0.1:4000;

                # 5. Non-destructive stream transformation for pristine vendor SPA:
                proxy_http_version   1.1;
                proxy_set_header     Upgrade $http_upgrade;
                proxy_set_header     Connection $connection_upgrade;
                proxy_set_header     Host $host;
                proxy_set_header     X-Real-IP $remote_addr;
                proxy_set_header     X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header     X-Forwarded-Proto https;
                proxy_set_header     Accept-Encoding "";
                sub_filter '<base href="/">' '<base href="/$team_prefix/">';
                sub_filter 'this.baseURL=""' 'this.baseURL="/$team_prefix"';
                sub_filter 'prefix:"/assets/i18n/"' 'prefix:"assets/i18n/"';
                sub_filter '}/ws`' '}/$team_prefix/ws`';
                sub_filter 'window.open(o,"_blank")' 'window.open(o.slice(1),"_blank")';
                sub_filter 'window.open(s,"_blank")' 'window.open(s.slice(1),"_blank")';
                sub_filter_types application/javascript text/javascript;
                sub_filter_once off;
            }

            # ----------------------------------------------------------------------------------
            # Fallback Root Handler
            # ----------------------------------------------------------------------------------
            location / {
                if ($query_string ~* "^portnumber=(4000|888[89]|889[0-9]|890[0-8]|20[0-4][0-9]|2050)(.*)$") {
                    set $inst_port $1;
                    set $inst_param $2;
                    proxy_pass http://127.0.0.1:$inst_port$inst_param;
                    break;
                }
                if ($query_string ~* "portnumber=") {
                    return 403;
                }
                return 301 https://$host/app1-team/;
            }
        }
    }
