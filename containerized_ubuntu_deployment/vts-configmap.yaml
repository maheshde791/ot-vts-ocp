apiVersion: v1
kind: ConfigMap
metadata:
  name: vts-app1-config
  namespace: lre-vts
  labels:
    app: vts-app1-team
data:
  # 1. OpenText VTS 26.1 Tuned Configuration with RBAC & Wide Valkey Port Pool
  configure.json: |
    {  
      "dbPath": "/var/lib/OT/OT_VTS/db/data",  
      "defaultDbName": "Default",
      "adminPort": 4000,
      "defaultApiPort": 8888,
      "defaultStart": true,
      "enableDiag": false,
      "autoRefreshGrid": false,
      "maxInstancesAllowed": 50,
      "autoCreateIndexedColumn": true,
      "normalizeCSV": false,
      "admin": {
        "authentication": "Basic",
        "users": [
          {
            "user": "vtsadmin",
            "password": "*****",
            "display": "VTS Administrator"
          },
          {
            "user": "tester",
            "password": "*****",
            "display": "Test Operator"
          }
        ],
        "role": {
          "administrator": [
            "vtsadmin"
          ],
          "user": [
            "tester"
          ]
        },
        "requireBasicAuthForAPI": true,
        "domain": "",
        "domaincontroller": "",
        "ldapsCert": "",
        "ldapsCA": "",
        "useSSL": false,
        "certificate": "vts.crt",
        "privateKey": "vts.key",
        "passphrase": "",
        "ca": "vts.crt",
        "minVersion": "TLSv1.2",
        "maxVersion": "TLSv1.3",
        "ciphers": "ETCD_CIPHER_SUITES=TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384",
        "requestClientCert": false
      },
      "languages": [
        { "en": "en-us" },
        { "zh-cn": ["zh", "zh-sg"] },
        { "ja": "ja" },
        { "ko": ["zh", "zh-sg"] },
        { "it": "zh-hk" },
        { "es": "zh-hk" },
        { "fr": "fr-fr" },
        { "ru": "ru" },
        "de"
      ],
      "defaultLanguage": "en",
      "dbInfo": {
        "connPool": {
          "maxIdle": 5000,
          "maxActive": 5000
        },
        "dbServerPort": { 
          "start": 10000,
          "end": 30000
        },
        "dbCheck": {
          "waitingTime": 10,
          "retryTimes": 3600
        }
      },
      "logger": {
        "level": "error", 
        "transports": {
          "file": {
            "type": "File",
            "path": "/var/log/vts.log"
          },
          "console": {
            "type": "Console"
          }
        }
      }
    }

  # 2. In-Container NGINX Reverse Proxy (HTTPS 8443, Path-Strip & 20-Instance Routing)
  vts-nginx.conf: |
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    server {
        listen 8443 ssl http2;
        server_name _;

        ssl_certificate      /etc/pki/tls/certs/vts.crt;
        ssl_certificate_key  /etc/pki/tls/private/vts.key;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          HIGH:!aNULL:!MD5;
        ssl_session_cache    shared:SSL:50m;
        ssl_session_timeout  1d;

        proxy_http_version   1.1;
        proxy_set_header     Upgrade $http_upgrade;
        proxy_set_header     Connection $connection_upgrade;
        proxy_set_header     Host $host;
        proxy_set_header     X-Real-IP $remote_addr;
        proxy_set_header     X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header     X-Forwarded-Proto https;

        client_max_body_size 100m;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Match /app1-team path from App Gateway / OpenShift Route
        location ~ ^/app1-team(?<req_path>/.*)?$ {
            # 1. Multi-Instance Query-String routing (ports 4000, 8888, 2000-2050)
            if ($query_string ~* "^portnumber=(4000|888[89]|889[0-9]|890[0-8]|20[0-4][0-9]|2050)(.*)$") {
                set $inst_port $1;
                set $inst_param $2;
                proxy_pass http://127.0.0.1:$inst_port$inst_param;
                break;
            }

            # 2. Block SSRF attempts to internal Valkey ports (10000-30000)
            if ($query_string ~* "portnumber=") {
                return 403;
            }

            # 3. Default: root goes to VTS Admin Web UI (port 4000)
            proxy_pass http://127.0.0.1:4000$req_path;
        }

        # Fallback root location
        location / {
            if ($query_string ~* "^portnumber=(4000|888[89]|889[0-9]|890[0-8]|20[0-4][0-9]|2050)(.*)$") {
                set $inst_port $1;
                set $inst_param $2;
                proxy_pass http://127.0.0.1:$inst_port$inst_param;
                break;
            }
            if ($query_string ~* "portnumber=") {
                return 403;
            }
            proxy_pass http://127.0.0.1:4000;
        }
    }
