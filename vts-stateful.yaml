apiVersion: apps/v1
kind: Deployment
metadata:
  name: vts-server
  namespace: lre-vts
  labels:
    app: vts-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vts-server
  template:
    metadata:
      labels:
        app: vts-server
    spec:
      securityContext:
        fsGroup: 54345
      containers:
      - name: vts-server
        image: performancetesting/opentext_vts_linux_ubuntu:26.3
        imagePullPolicy: IfNotPresent
        workingDir: /opt/OT/OT_VTS/web
        # Define compute resources to eliminate noisy-neighbor issues
        resources:
          requests:
            cpu: "500m"        # 0.5 vCPU guaranteed
            memory: "1Gi"       # 1 GiB RAM guaranteed
          limits:
            cpu: "1000m"       # Max 1 vCPU ceiling
            memory: "2Gi"       # Max 2 GiB RAM ceiling        
        command: ["/bin/bash", "-c"]
        args:
        - |
          # 1. Ensure instances.json exists cleanly on the PVC
          DATA_FILE="/var/lib/OT/OT_VTS/db/data/instances.json"
          if [ ! -f "$DATA_FILE" ] || [ ! -s "$DATA_FILE" ] || grep -q "null" "$DATA_FILE"; then
            echo "[]" > "$DATA_FILE" 2>/dev/null || true
            chmod 664 "$DATA_FILE" 2>/dev/null || true
          fi

          # 2. Configure automatic RDB snapshots every 60s (only if data changed)
          sed -i '/^save /d' /opt/OT/OT_VTS/web/redis.conf 2>/dev/null || true
          echo "save 60 1" >> /opt/OT/OT_VTS/web/redis.conf 2>/dev/null || true

          # 3. Start reverse proxy
          nginx

          # 4. Start supervisor daemon in background (manages apiserver and valkey-server)
          ./api_daemon </dev/null &

          # 5. Keep container alive and track processes
          wait -n
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/bash
              - -c
              - |
                # Dynamically discover every running Valkey instance port and save data to PVC
                for pid in $(pgrep valkey-server 2>/dev/null); do
                  PORT=$(cat /proc/$pid/cmdline 2>/dev/null | tr '\0' ' ' | grep -oP '127\.0\.0\.1:\K\d+')
                  if [ -n "$PORT" ]; then
                    /opt/OT/OT_VTS/web/valkey-cli -p "$PORT" save 2>/dev/null || true
                  fi
                done
                sync
        ports:
        - name: admin-api
          containerPort: 4000
        - name: admin-web
          containerPort: 8080
        - name: data-web
          containerPort: 8888
        volumeMounts:
        - name: config-mount
          mountPath: /opt/OT/OT_VTS/web/configure.json
          subPath: configure.json
        - name: vts-db-storage
          mountPath: /var/lib/OT/OT_VTS/db/data
      volumes:
      - name: config-mount
        configMap:
          name: vts-config
      - name: vts-db-storage
        persistentVolumeClaim:
          claimName: vts-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: vts-service
  namespace: lre-vts
  labels:
    app: vts-server
spec:
  type: ClusterIP
  selector:
    app: vts-server
  ports:
  - name: admin-web
    port: 8080
    targetPort: 8080
  - name: admin-ssl
    port: 8443
    targetPort: 8443
  - name: internal-api
    port: 4000
    targetPort: 4000
  - name: data-port
    port: 8888
    targetPort: 8888
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: vts-admin-route
  namespace: lre-vts
spec:
  host: vts-admin-route-lre-vts.apps-crc.testing
  to:
    kind: Service
    name: vts-service
  port:
    targetPort: admin-web
  tls:
    termination: edge
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: vts-data-route
  namespace: lre-vts
spec:
  host: vts-data-route-lre-vts.apps-crc.testing
  to:
    kind: Service
    name: vts-service
  port:
    targetPort: data-port
  tls:
    termination: edge
